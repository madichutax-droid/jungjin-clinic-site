# 정진한의원 홈페이지 — Netlify 설정
# 정적 사이트라 빌드 과정이 없습니다. 폴더를 그대로 게시합니다.

[build]
  publish = "."

# 아이디 찾기 · 비밀번호 재설정을 처리하는 서버 함수가 여기 있습니다.
# 여기에만 service_role 열쇠가 닿습니다 (Netlify 환경변수 SUPABASE_SERVICE_ROLE).
[functions]
  directory = "netlify/functions"

# 보안 헤더
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 정적 자원 캐시 (로고·사진)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 생성기 폴더는 공개하지 않습니다
# force = true 가 있어야 합니다 — Netlify 의 리다이렉트는 실제로 있는 파일에는
# 적용되지 않아, 이 줄이 없으면 .py 원본이 그대로 나갑니다 (2026-09-09 확인)
[[redirects]]
  from = "/_build/*"
  to = "/404.html"
  status = 404
  force = true

# 작업 규칙 문서도 공개하지 않습니다 — 내부 메모와 미해결 과제가 적혀 있습니다
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

# 함수 원본도 공개하지 않습니다. 부르는 주소는 /.netlify/functions/... 라
# 이 규칙에 걸리지 않습니다 — 막는 것은 소스 파일뿐입니다.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
